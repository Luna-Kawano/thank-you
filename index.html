<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta charset="UTF-8">
  <title>tuna kawano</title>
  <meta name="color-scheme" content="only light">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #fff;
      color: #000;
      font-family: 'Courier Prime', 'Courier New', monospace;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      cursor: pointer;
      padding: 40px 24px;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px;
    }

    .logo {
      width: 120px;
      max-width: 40vw;
    }

    .tap-label {
      font-size: 16px;
      opacity: 0.7;
    }

    .player {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      width: 200px;
    }

    .player.active { display: flex; }
    .tap-label.hidden { display: none; }

    .progress-track {
      width: 100%;
      height: 1px;
      background: #ddd;
    }

    .progress-fill {
      height: 1px;
      background: #000;
      width: 0%;
    }

    .player-label {
      font-size: 13px;
      opacity: 0.5;
      letter-spacing: 0.05em;
    }

    .shop-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: 'Courier Prime', monospace;
      font-size: 14px;
      color: #000;
      background: none;
      border: 1px solid #000;
      padding: 7px 14px;
      cursor: pointer;
      text-decoration: none;
      letter-spacing: 0.02em;
      transition: background 0.15s, color 0.15s;
    }

    .shop-btn:hover {
      background: #000;
      color: #fff;
    }

    .play-pause-btn {
      border: 1px solid #888;
      background: #fff;
      color: #999;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      padding: 6px 12px;
      margin-bottom: 15px;
      font-family: 'Courier Prime', monospace;
      letter-spacing: 0.05em;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }

    .play-pause-btn:hover {
      background: #000;
      color: #fff;
      border-color: #000;
    }

    /* Use inline SVG icons sized to match previous glyphs; prevents emoji substitution */
    .play-pause-btn svg {
      width: 14px;
      height: 14px;
      display: block;
    }

    .play-pause-btn .pause-icon { display: none; }
    .play-pause-btn.playing .play-icon { display: none; }
    .play-pause-btn.playing .pause-icon { display: block; }

  </style>
</head>
<body>
  <div class="container">
    <img src="tuna_logo.svg" alt="tuna kawano" class="logo">
    <p class="tap-label" id="tapLabel">Tap anywhere for a little voice note :)</p>
    <div class="player" id="player">
      <button class="play-pause-btn" id="playPauseBtn" aria-label="play/pause" aria-pressed="false">
        <!-- Play icon (triangle) -->
        <svg class="play-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M8 5v14l11-7z" fill="currentColor"></path>
        </svg>
        <!-- Pause icon (two bars) -->
        <svg class="pause-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <rect x="6" y="5" width="4" height="14" fill="currentColor"></rect>
          <rect x="14" y="5" width="4" height="14" fill="currentColor"></rect>
        </svg>
      </button>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <span class="player-label" id="playerLabel">playing...</span>
    </div>
    <a href="https://tunakawano.com" class="shop-btn" target="_blank" rel="noopener" id="shopBtn">
      SHOP &amp; GALLERY →
    </a>
  </div>

  <audio id="audio" src="thank_you_message.m4a" preload="auto"></audio>

  <script>
    const audio          = document.getElementById('audio');
    const tapLabel       = document.getElementById('tapLabel');
    const player         = document.getElementById('player');
    const playerLabel    = document.getElementById('playerLabel');
    const progressFill   = document.getElementById('progressFill');
    const playPauseBtn   = document.getElementById('playPauseBtn');

    let hasStarted = false;

    function setPlayingUI() {
      playPauseBtn.classList.add('playing');
      playPauseBtn.setAttribute('aria-pressed', 'true');
    }

    function setPausedUI() {
      playPauseBtn.classList.remove('playing');
      playPauseBtn.setAttribute('aria-pressed', 'false');
    }

    function startPlayback() {
      audio.currentTime = 0;
      audio.play();
      tapLabel.classList.add('hidden');
      player.classList.add('active');
      playerLabel.textContent = 'playing...';
      setPlayingUI();
      progressFill.style.width = '0%';
      hasStarted = true;
    }

    function togglePlayPause() {
      if (audio.paused) {
        audio.play();
        playerLabel.textContent = 'playing...';
        setPlayingUI();
      } else {
        audio.pause();
        playerLabel.textContent = 'paused';
        setPausedUI();
      }
    }

    document.body.addEventListener('click', (e) => {
      if (e.target.closest('#shopBtn')) return;
      if (!hasStarted) {
        startPlayback();
      }
    });

    playPauseBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      togglePlayPause();
    });

    audio.addEventListener('timeupdate', () => {
      if (!audio.duration) return;
      progressFill.style.width = (audio.currentTime / audio.duration * 100) + '%';
    });

    audio.addEventListener('error', () => {
      console.error('Audio failed to load or play', audio.error);
      playerLabel.textContent = 'audio error';
    });

    audio.addEventListener('canplay', () => {
      console.log('Audio ready to play');
    });

    audio.addEventListener('loadeddata', () => {
      console.log('Audio loaded successfully');
    });

    audio.addEventListener('ended', () => {
      player.classList.remove('active');
      tapLabel.classList.remove('hidden');
      hasStarted = false;
      setPausedUI();
    });
  </script>
</body>
</html>
